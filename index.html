<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="O site do Bananal Camp está em manutenção. Em breve estaremos de volta."
    />
    <meta name="theme-color" content="#ffc400" />
    <title>Bananal Camp | Site em manutenção</title>
    <style>
      :root {
        color-scheme: light;
        --yellow: #ffc400;
        --ink: #080808;
        --paper: #fffef9;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        overflow-x: hidden;
        background:
          radial-gradient(circle at 18% 24%, rgba(255, 196, 0, 0.2), transparent 29rem),
          linear-gradient(135deg, #ffffff 0%, var(--paper) 62%, #fff8d4 100%);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        background-image: linear-gradient(rgba(8, 8, 8, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(8, 8, 8, 0.035) 1px, transparent 1px);
        background-size: 42px 42px;
        content: "";
        mask-image: linear-gradient(to bottom, black, transparent 78%);
      }

      .maintenance {
        position: relative;
        display: grid;
        grid-template-columns: minmax(260px, 520px) minmax(280px, 590px);
        align-items: center;
        justify-content: center;
        gap: clamp(2rem, 6vw, 6rem);
        min-height: 100svh;
        padding: clamp(2rem, 6vw, 5rem);
        isolation: isolate;
      }

      .maintenance::after {
        position: absolute;
        right: -9rem;
        bottom: -11rem;
        z-index: -1;
        width: 30rem;
        height: 30rem;
        border: 4.5rem solid var(--yellow);
        border-radius: 50%;
        content: "";
        opacity: 0.82;
      }

      .logo-wrap {
        position: relative;
        display: grid;
        place-items: center;
      }

      .logo {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 24px 28px rgba(36, 27, 0, 0.15));
      }

      .content {
        max-width: 36rem;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.7rem;
        margin: 0 0 1.25rem;
        font-size: clamp(0.72rem, 1vw, 0.84rem);
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 2.5rem;
        height: 0.35rem;
        border-radius: 999px;
        background: var(--yellow);
        content: "";
      }

      h1 {
        max-width: 10ch;
        margin: 0;
        font-size: clamp(2.9rem, 4.1vw, 4.75rem);
        font-style: italic;
        font-weight: 950;
        letter-spacing: -0.075em;
        line-height: 0.85;
        text-transform: uppercase;
      }

      h1 span {
        position: relative;
        display: inline-block;
        margin-top: 0.14em;
        z-index: 0;
      }

      h1 span::after {
        position: absolute;
        right: -0.06em;
        bottom: 0.02em;
        left: -0.04em;
        z-index: -1;
        height: 0.22em;
        background: var(--yellow);
        content: "";
        transform: skewX(-10deg);
      }

      @media (max-width: 780px) {
        .maintenance {
          grid-template-columns: 1fr;
          gap: 1.25rem;
          min-height: 100svh;
          padding: 2rem 1.25rem 3rem;
          text-align: center;
        }

        .logo-wrap {
          width: min(76vw, 390px);
          margin-inline: auto;
        }

        .content {
          margin-inline: auto;
        }

        .eyebrow {
          justify-content: center;
        }

        h1 {
          max-width: none;
          font-size: clamp(2.45rem, 11vw, 3.85rem);
          line-height: 0.9;
        }

        .maintenance::after {
          right: -12rem;
          bottom: -15rem;
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .logo {
          animation: arrive 700ms cubic-bezier(0.2, 0.75, 0.2, 1) both;
        }

        .content {
          animation: arrive 700ms 100ms cubic-bezier(0.2, 0.75, 0.2, 1) both;
        }

        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(18px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>
  <body>
    <main class="maintenance" aria-labelledby="maintenance-title">
      <div class="logo-wrap">
        <img
          class="logo"
          src="assets/logo-bananal-camp.png"
          alt="Bananal Camp — Ilha do Bananal, Tocantins"
          width="1307"
          height="1203"
        />
      </div>

      <section class="content">
        <p class="eyebrow">Estamos preparando novidades</p>
        <h1 id="maintenance-title">Site em <span>manutenção</span></h1>
      </section>
    </main>
  </body>
</html>
